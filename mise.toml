# ==========================================
# 构建任务
# ==========================================

[tasks.build]
description = "编译 debug 版本"
run = "swift build"

[tasks.bundle]
description = "编译 release 版本，打包为 build/Flotilla.app 并 ad-hoc 签名"
run = "./Scripts/bundle.sh"

# ==========================================
# swift 代码规范任务
# ==========================================

[tasks."swift:format"]
description = "格式化 Swift 代码"

# 只装 Command Line Tools 时，SwiftLint 默认找不到 sourcekitdInProc，需要显式指定工具链目录
env = { TOOLCHAIN_DIR = "/Library/Developer/CommandLineTools" }
run = "swift package --allow-writing-to-package-directory format"

[tasks."swift:lint"]
description = "检查 Swift 代码规范"
run = "mise run swift:format --lint"

# ==========================================
# 官网任务
# ==========================================

[tasks."site:build"]
description = "组装官网到 build/site/"
run = "./Scripts/site.sh"

[tasks."site:preview"]
description = "组装官网并在本机预览，访问路径与线上一样带 /Flotilla/ 前缀"
depends = ["site:build"]
run = """
# 线上是项目页，挂在 /Flotilla/ 下：在临时目录里建指向 build/site 的同名符号链接再起服务，
# 以 / 开头的错误路径在本机就会失效
root="$(mktemp -d)"
trap 'rm -rf "$root"' EXIT
ln -s "$PWD/build/site" "$root/Flotilla"

echo "官网预览：http://localhost:8000/Flotilla/"
python3 -m http.server 8000 --bind 127.0.0.1 --directory "$root"
"""

# ==========================================
# 发布任务
# ==========================================

[tasks.release]
description = "为新版本开 release PR，用法：mise run release X.Y.Z"
run = "./Scripts/release.sh"
