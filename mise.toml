# ==========================================
# 构建任务
# ==========================================

[tasks.build]
description = "编译 debug 版本"
run = "swift build"

[tasks.bundle]
description = "编译 release 版本，打包为 build/Flotilla.app 并 ad-hoc 签名"
run = "./Scripts/bundle.sh"

# ==========================================
# swift 代码规范任务
# ==========================================

[tasks."swift:format"]
description = "格式化 Swift 代码"

# 只装 Command Line Tools 时，SwiftLint 默认找不到 sourcekitdInProc，需要显式指定工具链目录
env = { TOOLCHAIN_DIR = "/Library/Developer/CommandLineTools" }
run = "swift package --allow-writing-to-package-directory format"

[tasks."swift:lint"]
description = "检查 Swift 代码规范"
run = "mise run swift:format --lint"

# ==========================================
# 官网任务
# ==========================================

[tasks."site:build"]
description = "组装官网到 build/site/"
run = "./Scripts/site.sh"

[tasks."site:preview"]
description = "组装官网并在本机预览，地址为 http://localhost:8000/"
depends = ["site:build"]
run = """
echo "官网预览：http://localhost:8000/"
python3 -m http.server 8000 --bind 127.0.0.1 --directory build/site
"""

# ==========================================
# 发布任务
# ==========================================

[tasks.release]
description = "为新版本开 release PR，用法：mise run release X.Y.Z"
run = "./Scripts/release.sh"

[tasks.appcast]
description = "将 build/Flotilla.app 压缩，生成嵌入这一版更新说明的签名更新清单"
run = "bash Scripts/appcast.sh"
