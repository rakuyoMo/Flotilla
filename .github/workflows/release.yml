# 标题为 `release: X.Y.Z` 的 PR 合并进 main 后，打包并发布 GitHub Release

name: 发布

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions: {}

jobs:
  release:
    name: 发布新版本

    # `startsWith` 不区分大小写，标题的完整格式由 “校验版本号” 一步严格检查
    if: >-
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.title, 'release:')

    runs-on: macos-26

    permissions:
      contents: write

    # PR 标题由用户填写，只经环境变量交给脚本，不直接展开进 shell
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}

    steps:
      # 打包与打 tag 都基于 PR 合并进 main 后产生的提交
      - name: 检出合并提交
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: 校验版本号
        run: |
          # 标题必须是 `release: X.Y.Z`，三段都是不带前导零的非负整数
          pattern='^release: (0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR 标题须为 release: X.Y.Z，实际为 ${PR_TITLE}"
            exit 1
          fi

          version="${PR_TITLE#release: }"

          # 展示版本与标题一致，整数构建号须比合并前的 main 增加一次
          info_plist="Sources/Flotilla/Info.plist"
          value="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")"

          if [[ "$value" != "$version" ]]; then
            echo "::error::展示版本须为 ${version}，实际为 ${value}"
            exit 1
          fi

          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")"
          previous_build="$(git show "${MERGE_COMMIT_SHA}^:$info_plist" | plutil -extract CFBundleVersion raw -o - -)"

          if [[ ! "$build" =~ ^[1-9][0-9]*$ || ! "$previous_build" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::构建号须为正整数"
            exit 1
          fi

          if [[ "$build" -ne "$((previous_build + 1))" ]]; then
            echo "::error::构建号须从 ${previous_build} 增加到 $((previous_build + 1))，实际为 ${build}"
            exit 1
          fi

          # 查询远端的同名 tag：`--exit-code` 下退出码 0 表示已存在，2 表示不存在，其它表示查询本身失败
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null \
            || status=$?

          # 同名 tag 已存在说明这个版本发布过
          if [[ "$status" -eq 0 ]]; then
            echo "::error::tag v${version} 已存在"
            exit 1
          fi

          # 查询失败时无法确认 tag 不存在，不能继续发布
          if [[ "$status" -ne 2 ]]; then
            echo "::error::查询远端 tag 失败，退出码 ${status}"
            exit 1
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: 安装 mise
        uses: jdx/mise-action@v4

      # 缺少签名密钥时不发布不能自动安装的版本
      - name: 检查更新签名配置
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::请配置 SPARKLE_PRIVATE_KEY 仓库 secret"
            exit 1
          fi

      - name: 打包
        run: mise run bundle

      - name: 压缩并签名更新清单
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: mise run appcast

      # 一步完成打 tag、创建 Release、上传 zip；tag 打在合并提交上
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "build/updates/Flotilla-$VERSION.zip" \
            "build/updates/appcast.xml" \
            --target "$MERGE_COMMIT_SHA" \
            --generate-notes
