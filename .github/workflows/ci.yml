# 向 main 提 PR 与推送到 main 时，检查代码规范、编译、测试并打包；release PR 另外检查这一版的更新说明

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# 同一 PR 的新推送取消旧运行；推送到 main 按提交各自分组，互不取消
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查与构建
    runs-on: macos-26

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # release PR 合并后就要发布，与 release.yml 一样按标题前缀识别；版本号取 Info.plist 里将要发布的展示版本
      - name: 检查更新说明
        if: startsWith(github.event.pull_request.title, 'release:')
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Sources/Flotilla/Info.plist)"
          ./Scripts/check-release-notes.sh "$version"

      - name: 安装 mise
        uses: jdx/mise-action@v4

      - name: 检查代码规范
        run: mise run swift:lint

      - name: 编译
        run: mise run build

      - name: 测试
        run: swift test

      - name: 打包
        run: mise run bundle
