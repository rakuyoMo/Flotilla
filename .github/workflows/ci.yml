# 向 main 提 PR 与推送到 main 时，检查代码规范、编译、测试并打包

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# 同一 PR 的新推送取消旧运行；推送到 main 按提交各自分组，互不取消
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查与构建
    runs-on: macos-26

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 mise
        uses: jdx/mise-action@v4

      - name: 检查代码规范
        run: mise run swift:lint

      # 更新清单脚本只在发版时运行，CI 的 Swift 编译器又比本机旧
      # 在 PR 上先用 CI 的工具链做类型检查，编译问题不必等到发版才暴露
      - name: 检查更新清单脚本
        run: swiftc -typecheck Scripts/embed-release-notes.swift

      - name: 编译
        run: mise run build

      - name: 测试
        run: swift test

      - name: 打包
        run: mise run bundle
