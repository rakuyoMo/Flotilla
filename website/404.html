<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <!-- GitHub Pages 在任意不存在的路径下返回本页，相对路径一律从站点根目录算起 -->
  <base href="/Flotilla/">

  <title>Page not found · 找不到页面 — Flotilla</title>

  <meta
    name="color-scheme"
    content="light dark"
  >

  <meta
    name="theme-color"
    content="#C2E9FD"
    media="(prefers-color-scheme: light)"
  >

  <meta
    name="theme-color"
    content="#020D25"
    media="(prefers-color-scheme: dark)"
  >

  <link
    rel="icon"
    href="assets/img/favicon-light.png"
    type="image/png"
    media="(prefers-color-scheme: light)"
  >

  <link
    rel="icon"
    href="assets/img/favicon-dark.png"
    type="image/png"
    media="(prefers-color-scheme: dark)"
  >

  <link
    rel="apple-touch-icon"
    href="assets/img/apple-touch-icon.png"
  >

  <link
    rel="stylesheet"
    href="assets/css/site.css"
  >

  <link
    rel="stylesheet"
    href="assets/css/not-found.css"
  >
</head>
<body>
  <main class="hero not-found">
    <div
      class="hero-sky"
      aria-hidden="true"
    ></div>

    <div class="container not-found-inner">
      <a
        class="brand"
        href="./"
      >
        <picture>
          <source
            srcset="assets/img/app-icon-dark-64.png"
            media="(prefers-color-scheme: dark)"
          >

          <img
            src="assets/img/app-icon-light-64.png"
            alt=""
            width="32"
            height="32"
          >
        </picture>

        <span>Flotilla</span>
      </a>

      <div
        class="ship-art"
        aria-hidden="true"
      >
        <picture>
          <source
            srcset="assets/img/sailing-ship-moon.jpg"
            media="(prefers-color-scheme: dark)"
          >

          <img
            src="assets/img/sailing-ship-sun.jpg"
            alt=""
            width="1000"
            height="1000"
          >
        </picture>
      </div>

      <p class="not-found-code">404</p>

      <h1 class="not-found-title">
        <span>Page not found</span>
        <span lang="zh-Hans">找不到这个页面</span>
      </h1>

      <div class="not-found-actions">
        <a
          class="button button-primary"
          href="./"
        >
          Back to home
          <svg
            class="icon"
            aria-hidden="true"
            viewBox="0 0 24 24"
          >
            <path d="M5 12h14"/>
            <path d="m13 6 6 6-6 6"/>
          </svg>
        </a>

        <a
          class="button button-secondary"
          href="zh/"
          lang="zh-Hans"
          hreflang="zh-Hans"
        >
          返回首页
          <svg
            class="icon"
            aria-hidden="true"
            viewBox="0 0 24 24"
          >
            <path d="M5 12h14"/>
            <path d="m13 6 6 6-6 6"/>
          </svg>
        </a>
      </div>
    </div>

    <svg
      class="hero-waves"
      viewBox="0 0 1440 120"
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      <path
        class="wave wave-back"
        d="M0 46C86.4 36 153.6 36 240 46s153.6 10 240 0 153.6-10 240 0 153.6 10 240 0 153.6-10 240 0 153.6 10 240 0 153.6-10 240 0 153.6 10 240 0 153.6-10 240 0 153.6 10 240 0 153.6-10 240 0 153.6 10 240 0V120H0Z"
      />

      <path
        class="wave wave-middle"
        d="M0 64C64.8 56 115.2 56 180 64s115.2 8 180 0 115.2-8 180 0 115.2 8 180 0 115.2-8 180 0 115.2 8 180 0 115.2-8 180 0 115.2 8 180 0 115.2-8 180 0 115.2 8 180 0 115.2-8 180 0 115.2 8 180 0 115.2-8 180 0 115.2 8 180 0 115.2-8 180 0 115.2 8 180 0V120H0Z"
      />

      <path
        class="wave wave-front"
        d="M0 84C129.6 75 230.4 75 360 84s230.4 9 360 0 230.4-9 360 0 230.4 9 360 0 230.4-9 360 0 230.4 9 360 0 230.4-9 360 0 230.4 9 360 0V120H0Z"
      />
    </svg>
  </main>
</body>
</html>
